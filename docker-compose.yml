services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_dock_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: ["echo", "qa_dock service started"]

